name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: The command or URL you used. Please remove any token.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node.js version
      placeholder: "node --version"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, generated SVGs or error output are very welcome.
