name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the compiled CLI
        run: node dist/bin.js --demo --out "$RUNNER_TEMP/cards" --card summary

  action:
    name: GitHub Action works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on sample data
        id: wrapped
        uses: ./
        with:
          demo: "true"
          commit: "false"
          output-dir: action-cards
      - name: Check the output
        run: |
          test "${{ steps.wrapped.outputs.changed }}" = "true"
          test -s action-cards/summary-dark.svg
          test -s action-cards/summary-light.svg
          test "$(ls action-cards | wc -l)" -eq 12

  examples:
    name: Examples are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run examples
      - name: Fail if docs/examples changed
        run: git diff --exit-code docs/examples
