<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="gw-personality-t gw-personality-d">
<title id="gw-personality-t">Dev personality of sample-dev in 2025</title>
<desc id="gw-personality-d">The Night Owl. The best commits happen after the world goes to sleep.</desc>
<defs>
